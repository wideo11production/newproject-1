<!DOCTYPE html>
<html lang="en">
<!--
  OFFLINE FALLBACK PAGE
  Service worker (`public/sw.js`) me jab koi navigation request fail ho
  (offline / server unreachable) aur cached page bhi na mile, to ye page
  serve hoti hai.

  Ye deliberately INLINE-CSS wala hai (koi external asset nahi), kyunki
  network to available hi nahi hai yahan - koi bhi external stylesheet ya
  font load nahi hoga.

  Hinglish: offline page - app band ho to user ko saaf message mile
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - Wideo11</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111217;
      color: #d8d9da;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 380px; }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      margin-bottom: 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #2c3235;
      font-size: 12px;
      color: #9fa7b3;
    }
    h1 { font-size: 20px; margin: 0 0 10px; letter-spacing: -0.2px; }
    p { font-size: 14px; line-height: 1.6; color: #9fa7b3; margin: 0 0 24px; }
    button {
      background: #5794f2;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4a86e0; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">No connection</span>
    <h1>You are offline</h1>
    <p>
      Wideo11 needs a connection to load your dashboard. Anything you have
      already opened keeps working, but new pages will not load until you
      reconnect.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
