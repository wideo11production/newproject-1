<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Wideo11 Monitor">
  <defs>
  </defs>
  <!--
    Wideo11 monitoring favicon.

    Hand-rolled SVG instead of a binary .ico: it scales on any display, needs
    no build step, and is reviewable in a diff. Next.js App Router serves
    `src/app/icon.svg` as the site icon automatically.

    This file exists because the browser requests /favicon.ico unconditionally
    and got a 404 on every page load. Harmless in itself, but it was the one
    console error the dashboard produced, and a monitoring tool that logs an
    error nobody can explain trains people to ignore its logs.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <!-- baseline: the "chart" the panels draw -->
  <path d="M6 23h20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- the line, same colour family as the dashboard series -->
  <path d="M7 18l4-6 4 3 4-8 6 5"
        fill="none" stroke="#3b82f6" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="12" r="2.5" fill="#22c55e"/>
</svg>