# =============================================================================
# NATS JetStream configuration
# =============================================================================
#
# WHY A CONFIG FILE AT ALL
# -----------------------
# Before this file the service ran on `command: ["-js", "-m", "8222"]`:
# JetStream was ON and there were no streams. So the answer to "what does the
# event backbone carry" was "nothing".
#
# A config file is the right home for the server-level settings below because
# they are exactly the kind of thing you want to read in a diff.
#
# =============================================================================
# SCHEMA NOTES - NATS 2.10 REJECTS THE OBVIOUS SPELLINGS
# =============================================================================
#
#   * The monitoring port is `http: 8222` at the top level. There is NO
#     `monitor { ... }` block; that is from an older example and the server exits
#     with `unknown field "monitor"` rather than ignoring it.
#   * Streams were also attempted here - both as a top-level `jetstream { ... }`
#     entry and as `streams { }` inside the account. Both are rejected
#     (`unknown field "streams"`).
#
# So the TELEMETRY STREAM IS NOT DECLARED IN THIS FILE. It is created through the
# JetStream API by `docker/nats/init-stream.mjs`.
#
# That is genuinely equivalent for durability, which was the whole reason for
# preferring a config declaration: JetStream persists stream definitions in its
# own `store_dir`, so an API-created stream survives restarts exactly like a
# config-declared one. The original worry - "the stream disappears when the
# publisher is down" - was based on not knowing that, and it was wrong.
#
# Three attempts at a config that does not parse is one more than a config file
# is worth, and a NATS config that fails to parse takes the whole container down.
#
# -----------------------------------------------------------------------------
# SUBJECT NAMING
# -----------------------------------------------------------------------------
# Subjects are dotted and hierarchical, so a consumer subscribes to exactly the
# slice it wants: `ui.click.>` for everything, `ui.click.editor.>` for one app. A
# flat subject like `clicks` would force every consumer to filter in its own
# code, which is where ordering bugs appear.
#
# The app is part of the subject rather than a field, because JetStream selects
# on subject structure natively - both are one-line subscriptions with no
# message-level filtering.

port: 4222

# Monitoring port. Serves /healthz (the container healthcheck) and /jsz (stream
# inspection).
http: 8222

# ---- JetStream ----
jetstream {
  # File-backed inside the container. A telemetry stream is a few MB a day; the
  # memory limit matters for the burst right after a deploy, when every app
  # flushes its queued clicks at once.
  store_dir: "/data/jetstream"

  # A single JetStream domain. Multi-domain adds account complexity nothing here
  # needs.
  domain: "hub"

  # Explicit caps. The defaults are large, and this container shares a volume
  # with the host - a JetStream that fills the disk takes Postgres down with it,
  # because they are all on the same host.
  max_memory_store: 256MB
  max_file_store:    2GB
}

# ---- Accounts ----
#
# One account, HUB, with one credentialed user. New publishers use that credential.
#
# NOTE ON WHY THERE IS NOT A PER-SERVICE USER HERE: scoped publish/subscribe
# permissions are the right call when services have genuinely different blast
# radii. Today they do not - anything on this network can already reach Postgres
# and MinIO, so per-user NATS permissions would be theatre unless the rest of the
# network were locked down first. Recorded rather than quietly skipped, because
# "we added auth" and "we added authorisation" are very different claims.

# ---- ACCOUNTS AND AUTH: DELIBERATELY NOT SET HERE ----
#
# NATS accepts anonymous connections, exactly as before this file existed.
#
# An `accounts {}` block was attempted and removed after five spellings of it
# (`$G: HUB`, quoted, `streams` nested, `monitor {}`) each took the server
# down with `unknown field ...`. A container in a crash loop is worse than a
# missing feature, so this is filed as follow-up work rather than left broken.
#
# On this dev network the omission matches the surrounding posture: anything
# on the compose network can already reach Postgres and MinIO directly, so
# NATS auth alone would be security theatre. It is worth doing at the same
# time the network is locked down - not before.
#
# When it is done, this is what has to land together:
#   1. an `accounts { HUB { jetstream: enabled, users: [...] } }` block,
#   2. the global account mapped so `nats-exporter` (which connects without
#      credentials and logs `authentication error - User ""` otherwise) keeps
#      working, and
#   3. the publisher and `nats-exporter` given credentials.
#
# The stream itself is NOT declared here either. It is created through the
# JetStream API by `docker/nats/init-stream.mjs`, which is equivalent for
# durability - JetStream persists stream definitions in its own `store_dir`.
