server:
  port: "8087"
  mode: "release"
  read_timeout: 10
  write_timeout: 10

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "transcoding_service"
  sslmode: "disable"
  timezone: "UTC"

ffmpeg:
  path: "ffmpeg"
  input_dir: "/tmp/uploads"
  output_dir: "/tmp/transcoded"
  max_concurrent: 2
  qualities:
    - height: 2160
      bitrate: "12000k"
      codec: "h264"
      profile: "high"
    - height: 1080
      bitrate: "5000k"
      codec: "h264"
      profile: "high"
    - height: 720
      bitrate: "2500k"
      codec: "h264"
      profile: "main"
    - height: 480
      bitrate: "1000k"
      codec: "h264"
      profile: "main"
    - height: 360
      bitrate: "600k"
      codec: "h264"
      profile: "baseline"
    - height: 240
      bitrate: "400k"
      codec: "h264"
      profile: "baseline"
    - height: 144
      bitrate: "200k"
      codec: "h264"
      profile: "baseline"
