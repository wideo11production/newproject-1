global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'wideo11'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor - container CPU/memory/network REAL metrics
  # Ye job ke bina dashboard pe "no data" aata tha kyunki container metrics
  # sirf cAdvisor se aati hain (node-exporter se nahi).
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'

  # MinIO exporter - REAL bucket size + object count.
  # NOTE: ye apna khud ka exporter hai (services/minio-exporter) kyunki official
  # MinIO image blocked hone se uska native metrics path HTML return karta hai.
  # Ye MinIO Admin API se real stats padhta hai - koi placeholder value nahi.
  - job_name: 'minio'
    static_configs:
      - targets: ['minio-exporter:9100']
    metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'dashboard-service'
    static_configs:
      - targets: ['dashboard-service:8080']
    metrics_path: '/metrics'

  - job_name: 'webhook-receiver'
    static_configs:
      - targets: ['webhook-receiver:8081']
    metrics_path: '/metrics'

  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: '/metrics'
