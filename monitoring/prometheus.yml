global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'wideo11'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# ---- ALERTING RULES ----
#
# Ye path compose se MOUNT hota hai (./monitoring/rules -> /etc/prometheus/rules).
#
# Pehle ye line thi par compose me koi rules directory mount HI NAHI thi. Matlab
# Prometheus har start par `/etc/prometheus/rules/*.yml` dhoondta, kuch nahi
# milta, aur CHUP CHAP koi rule load nahi karta. Alertmanager ek healthy
# receiver tha jisko kabhi kuch bhi nahi jaata tha - matlab alert pipeline
# dikhta to bhi tha, sirf kuch trigger nahi hota tha. Woh "monitoring on" ka
# sabse khatarnaak roop hai: sab green, kuch check nahi.
#
# Rules ab `monitoring/rules/` me hain aur compose unhe mount karta hai. Naya
# rule yahan add karte waqt yaad rakhein: file `.yml` extension ke saath honi
# chahiye, warna ye glob use nahi hoga.
rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor - container CPU/memory/network REAL metrics
  # Ye job ke bina dashboard pe "no data" aata tha kyunki container metrics
  # sirf cAdvisor se aati hain (node-exporter se nahi).
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'

  # MinIO exporter - REAL bucket size + object count.
  # NOTE: ye apna khud ka exporter hai (services/minio-exporter) kyunki official
  # MinIO image blocked hone se uska native metrics path HTML return karta hai.
  # Ye MinIO Admin API se real stats padhta hai - koi placeholder value nahi.
  - job_name: 'minio'
    static_configs:
      - targets: ['minio-exporter:9100']
    metrics_path: '/metrics'

  # ---- node-exporter ----
  #
  # Ye job pehle DISABLED thi (`host.docker.internal:9100` kisi service ko
  # point kar rahi thi jo compose me exist hi nahi karta tha) - yaani target
  # hamesha DOWN rehta tha.
  #
  # Ab `node-exporter` service compose me hai (host filesystem read-only
  # mount ke saath), isliye ye job sach me disk/CPU/memory laati hai. Ye
  # `DiskFillingUp` aur `DiskSpaceCritical` rules ko zinda banata hai - wo
  # `node_filesystem_*` metrics pe depend karte hain, jinake bina dono rules
  # permanently inert rehte: green dikhte par kabhi fire nahi karte.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: '/metrics'

  # ---- nats: exporter ke through ----
  #
  # NATS ke apne koi Prometheus endpoint NAHI hai. Port 8222 pe wo JSON deta
  # hai (`/varz`), `/metrics` pe 404. Pehle seedha `nats:8222/metrics` scrape
  # kar raha tha, to NATS metrics hamesha DOWN rehte the.
  #
  # `nats-exporter` service NATS se JSON polling karke Prometheus format me
  # convert karti hai. `-jsz=all` se JetStream consumer/stream state bhi
  # aata hai - backlog ya stuck consumer yahi se dikhta hai.
  #
  # ---- METRIC PREFIX: `gnatsd_`, `nats_` NAHI ----
  # Exporter v0.15.0 `gnatsd_*` naam emit karta hai (gnatsd_connz_*, 
  # gnatsd_varz_*, gnatsd_jsz_*), na ki `nats_*`. Ye likhna zaroori hai
  # kyunki Galat prefix se banaya hua Grafana panel chup-chap "No data" 
  # dikhata hai - jo kisi ko yeh nahi batata ki panel banaya hi galat
  # tareeke se tha. Verify karne ke liye:
  #   curl -s localhost:9090/api/v1/label/__name__/values | grep -i nats
  - job_name: 'nats'
    static_configs:
      - targets: ['nats-exporter:7777']
    metrics_path: '/metrics'

  # ---- analytics-service (the click ledger's firehose) ----
  #
  # This job did not exist when the ledger was owned by auth-service, because
  # auth-service exposed no metrics at all. So `wideo11_ui_click_events_total` and
  # `wideo11_telemetry_*` had nowhere to be scraped from, and the alert rules that
  # watch them could not have fired.
  #
  # `/metrics` is deliberately NOT behind the internal token. Prometheus does not
  # present credentials, and a scrape endpoint that needs one would mean either
  # embedding a secret in prometheus.yml (which is mounted, and read by humans) or
  # adding an exporter sidecar purely to authenticate. The metrics are counters
  # with bounded labels - no user id, no email, no URL - so there is nothing in
  # them to protect. That constraint is enforced by
  # `analytics-service/src/metrics/cardinality_test.go`, not by good intentions.
  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:8091']
    metrics_path: '/metrics'

  - job_name: 'dashboard-service'
    static_configs:
      - targets: ['dashboard-service:8080']
    metrics_path: '/metrics'

  # ---- postgres ----
  #
  # Ye job pehle THI hi nahi, isliye `pg_up`, `pg_stat_activity_count`,
  # `pg_replication_lag_seconds` - teeno ka data source nahi tha. Matlab teen
  # alert rules (`PostgresDown`, `PostgresConnectionsNearMax`,
  # `PostgresReplicationLag`) POORI TARAH DEAD thi: load hoti thi, validate
  # hoti thi, par kabhi fire nahi ho sakti thi.
  #
  # `postgres-exporter` service ab compose me hai, jo `pg_monitor` role wale
  # read-only user se connect hota hai. Isi tarah `http_*` alerts dead the -
  # unke liye exporter nahi, balki service instrumentation chahiye (rules file
  # me documented hai).
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: '/metrics'

  - job_name: 'webhook-receiver'
    static_configs:
      - targets: ['webhook-receiver:8081']
    metrics_path: '/metrics'
