global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'wideo11'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'dashboard-service'
    static_configs:
      - targets: ['dashboard-service:8080']
    metrics_path: '/metrics'

  - job_name: 'webhook-receiver'
    static_configs:
      - targets: ['webhook-receiver:8081']
    metrics_path: '/metrics'

  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: '/metrics'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']