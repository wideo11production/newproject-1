global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'webhook-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'webhook-receiver'
      continue: true

receivers:
  - name: 'webhook-receiver'
    webhook_configs:
      - url: 'http://webhook-receiver:8081/api/v1/webhooks/alertmanager'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']