apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "video-editor.fullname" . }}
  labels:
    {{- include "video-editor.labels" . | nindent 6 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "video-editor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "video-editor.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV }}
            - name: AUTH_SERVICE_URL
              value: {{ .Values.env.AUTH_SERVICE_URL }}
            - name: NEXT_PUBLIC_AUTH_API_URL
              value: {{ .Values.env.NEXT_PUBLIC_AUTH_API_URL }}
            - name: JWT_SECRET_KEY
              value: {{ .Values.env.JWT_SECRET_KEY }}
            - name: PORT
              value: {{ .Values.env.PORT }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10