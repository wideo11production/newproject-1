{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring.fullname" . }}-dashboard
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "monitoring.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "monitoring.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        {{- toYaml .Values.dashboard.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ENVIRONMENT
              value: "{{ .Values.dashboard.env.ENVIRONMENT }}"
            - name: PORT
              value: "{{ .Values.dashboard.env.PORT }}"
            - name: PROMETHEUS_URL
              value: "{{ .Values.dashboard.env.PROMETHEUS_URL }}"
            - name: ALERTMANAGER_URL
              value: "{{ .Values.dashboard.env.ALERTMANAGER_URL }}"
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
{{- end }}