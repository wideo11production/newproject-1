{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.fullname" . }}-alertmanager-config
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
data:
  config.yml: |
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'webhook'
      
    receivers:
    - name: 'webhook'
      webhook_configs:
      - url: 'http://dashboard-service.monitoring.svc.cluster.local:8080/webhook'
      
    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: ['warning', 'info']
      equal: ['alertname', 'dev', 'instance']
{{- end }}