apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: push-service
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: push.wideo11.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "push-service.fullname" . }}
                port:
                  number: {{ .Values.service.port }}