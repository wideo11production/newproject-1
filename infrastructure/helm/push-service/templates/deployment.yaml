apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "push-service.fullname" . }}
  labels:
    {{- include "push-service.labels" . | nindent 6 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "push-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "push-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV }}
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL }}
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL }}
            - name: VAPID_PUBLIC_KEY
              value: {{ .Values.env.VAPID_PUBLIC_KEY }}
            - name: VAPID_PRIVATE_KEY
              value: {{ .Values.env.VAPID_PRIVATE_KEY }}
            - name: VAPID_SUBJECT
              value: {{ .Values.env.VAPID_SUBJECT }}
            - name: PORT
              value: {{ .Values.env.PORT }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10