# Service-specific values for config-service
# Common values are inherited from the base chart

replicaCount: 2

image:
  repository: wideo11/config-service
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: config-service.wideo11.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: config-service-tls
      hosts:
        - config-service.wideo11.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - config-service
          topologyKey: kubernetes.io/hostname

env:
  - name: ENVIRONMENT
    value: "production"
  - name: PORT
    value: "8080"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: wideo11-secrets
        key: database-url
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: wideo11-secrets
        key: redis-url
  - name: NATS_URL
    valueFrom:
      secretKeyRef:
        name: wideo11-secrets
        key: nats-url
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: wideo11-secrets
        key: jwt-secret
  - name: LOG_LEVEL
    value: "info"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

prometheusRule:
  enabled: true
  rules:
    - alert: ConfigServiceDown
      expr: up{job="config-service"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Config Service is down"
        description: "Config Service has been down for more than 1 minute"
    - alert: ConfigServiceHighErrorRate
      expr: rate(http_requests_total{job="config-service",status=~"5.."}[5m]) > 0.05
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Config Service high error rate"
        description: "Config Service error rate is above 5%"