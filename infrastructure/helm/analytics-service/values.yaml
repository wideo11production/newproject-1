replicaCount: 1
image:
  repository: wideo11/analytics-service
  pullPolicy: IfNotPresent
  tag: "latest"
service:
  type: ClusterIP
  port: 8085
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
env:
  NODE_ENV: "production"
  DATABASE_URL: "postgresql://wideo11:wideo11_password@postgres:5432/wideo11"
  REDIS_URL: "redis://redis:6379"
  NATS_URL: "nats://nats:4222"
  PORT: "8085"
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70