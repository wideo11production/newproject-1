replicaCount: 1
image:
  repository: wideo11/currency
  pullPolicy: IfNotPresent
  tag: "latest"
service:
  type: ClusterIP
  port: 3007
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
env:
  NODE_ENV: "production"
  PORT: "3007"
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70