apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: newproject-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wideo11/infrastructure.git
    targetRevision: HEAD
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
      heal:
        resourceFilters:
          - kind: Namespace
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
      - Validate=true
      - RespectIgnored=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: ""
      kind: Namespace
      jsonPointers:
        - /metadata/labels
        - /metadata/annotations
  healthChecks:
    - kind: Namespace
      scopes:
        - apiGroups: [""]
          kinds: ["Namespace"]
          namespaces: ["argocd"]