apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-services-hpa
  namespace: production
  labels:
    app: backend-services
    scaling-policy: smart-intercept
    managed-by: gke-smart-scaler
    node-pool-type: standard-fixed
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-services
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
  metrics:
    # PRIMARY: Authenticated user sessions (validated sessions only)
    - type: Pods
      pods:
        metric:
          name: authenticated_sessions_active
        target:
          type: AverageValue
          averageValue: "50"
    # SECONDARY: Authenticated request rate
    - type: Pods
      pods:
        metric:
          name: authenticated_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
    # CEILING ENFORCEMENT: CPU at 76% HARD LIMIT
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          utilization: 76
    # CEILING ENFORCEMENT: Memory at 76% HARD LIMIT
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          utilization: 76
    # ADAPTIVE: Unauthenticated traffic ratio - block scaling if > 50%
    - type: Pods
      pods:
        metric:
          name: unauthenticated_traffic_ratio
        target:
          type: AverageValue
          averageValue: "0.5"  # Scale blocked if unauth > 50%
---
# Node Pool Configuration: Standard Fixed (NOT Autopilot)
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: standard-fixed-pool
  namespace: production
  labels:
    node-pool-type: standard-fixed
    autopilot: "disabled"
spec:
  clusterRef:
    name: production-cluster
  config:
    machineType: e2-standard-4
    diskSizeGb: 100
    diskType: pd-ssd
    oauthScopes:
      - https://www.googleapis.com/auth/cloud-platform
    labels:
      node-pool-type: standard-fixed
      workload-type: backend-services
  initialNodeCount: 3
  maxNodeCount: 10
  minNodeCount: 3
  autoscaling:
    enabled: true
    minNodeCount: 3
    maxNodeCount: 10
  management:
    autoRepair: true
    autoUpgrade: true
  upgradeSettings:
    maxSurge: 1
    maxUnavailable: 0