# ============================================================================
# KUBERNETES DEPLOYMENT MANIFESTS
# ============================================================================
# Apply all resources in order:
# 1. Namespace
# 2. ConfigMaps and Secrets
# 3. Services (Postgres, Redis, NATS, MinIO)
# 4. Deployments
# 5. Ingress
# ============================================================================

# ============================================================================
# NAMESPACE
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: wideo11

---
# ============================================================================
# CONFIGMAP - Application configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: wideo11-config
  namespace: wideo11
data:
  NODE_ENV: "production"
  JWT_SECRET_KEY: "wideo11-super-secret-key-change-me"
  SUPERADMIN_EMAIL: "advchashampalup@gmail.com"
  SUPERADMIN_PASSWORD: "Rajaghenna123*#"
  DATABASE_URL: "postgresql://wideo11:wideo11_password@postgres:5432/wideo11"
  REDIS_URL: "redis://redis:6379"
  NATS_URL: "nats://nats:4222"
  AUTH_SERVICE_URL: "http://auth-service:8085"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  MINIO_BUCKET: "video"

---
# ============================================================================
# SECRET - Sensitive configuration
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: wideo11-secrets
  namespace: wideo11
type: Opaque
stringData:
  JWT_SECRET_KEY: "wideo11-super-secret-key-change-me"
  SUPERADMIN_PASSWORD: "Rajaghenna123*#"
  DATABASE_PASSWORD: "wideo11_password"
  MINIO_ROOT_PASSWORD: "minioadmin"
  VAPID_PRIVATE_KEY: ""
  VAPID_PUBLIC_KEY: ""

---
# ============================================================================
# POSTGRESQL
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: wideo11
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: wideo11
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wideo11-secrets
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              value: wideo11
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: wideo11
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres

---
# ============================================================================
# REDIS
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: wideo11
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: wideo11
  labels:
    app: redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis

---
# ============================================================================
# NATS
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: wideo11
  labels:
    app: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.9-alpine
          ports:
            - containerPort: 4222
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: wideo11
  labels:
    app: nats
spec:
  ports:
    - port: 4222
      targetPort: 4222
    - port: 8222
      targetPort: 8222
  selector:
    app: nats

---
# ============================================================================
# MINIO
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: wideo11
  labels:
    app: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          ports:
            - containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wideo11-secrets
                  key: MINIO_ROOT_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: wideo11
  labels:
    app: minio
spec:
  ports:
    - port: 9000
      targetPort: 9000
    - port: 9001
      targetPort: 9001
  selector:
    app: minio

---
# ============================================================================
# APP DEPLOYMENTS
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: wideo11
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/wideo11/auth-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wideo11-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wideo11-secrets
                  key: JWT_SECRET_KEY
            - name: SUPERADMIN_EMAIL
              value: "advchashampalup@gmail.com"
            - name: SUPERADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wideo11-secrets
                  key: SUPERADMIN_PASSWORD
            - name: PORT
              value: "8085"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
              initialDelaySeconds: 5
              periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: wideo11
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/wideo11/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8085"
            - name: NEXT_PUBLIC_AUTH_API_URL
              value: "http://localhost:3000/api/auth"
            - name: NEXT_PUBLIC_VIDEO_EDITOR_URL
              value: "http://localhost:3002"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wideo11-secrets
                  key: JWT_SECRET_KEY
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              initialDelaySeconds: 5
              periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-editor
  namespace: wideo11
  labels:
    app: video-editor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-editor
  template:
    metadata:
      labels:
        app: video-editor
    spec:
      containers:
        - name: video-editor
          image: ghcr.io/wideo11/video-editor:latest
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: "production"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8085"
            - name: NEXT_PUBLIC_AUTH_API_URL
              value: "http://localhost:3000/api/auth"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wideo11-secrets
                  key: JWT_SECRET_KEY
            - name: PORT
              value: "3002"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3002
              initialDelaySeconds: 5
              periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superadmin
  namespace: wideo11
  labels:
    app: superadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superadmin
  template:
    metadata:
      labels:
        app: superadmin
    spec:
      containers:
        - name: superadmin
          image: ghcr.io/wideo11/superadmin:latest
          ports:
            - containerPort: 3008
          env:
            - name: NODE_ENV
              value: "production"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8085"
            - name: NEXT_PUBLIC_AUTH_API_URL
              value: "http://localhost:3000/api/auth"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wideo11-secrets
                  key: JWT_SECRET_KEY
            - name: PORT
              value: "3008"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3008
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3008
              initialDelaySeconds: 5
              periodSeconds: 10

---
# ============================================================================
# INGRESS
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wideo11-ingress
  namespace: wideo11
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: wideo11.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    - host: superadmin.wideo11.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superadmin
                port:
                  number: 3008
    - host: video-editor.wideo11.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: video-editor
                port:
                  number: 3002
    - host: monitor.wideo11.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitor
                port:
                  number: 3001
    - host: analytics.wideo11.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 8080
    - host: currency.wideo11.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: currency
                port:
                  number: 3007
    - host: admin.wideo11.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3006