name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is needed for security scanning or deploying if we use the token
      # We'll add more permissions as needed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- pnpm, not npm ----
      #
      # Ye monorepo pnpm-only hai: root package.json me
      #   "preinstall": "npx only-allow pnpm"
      #   "packageManager": "pnpm@9.7.0"
      # aur pnpm-lock.yaml hai, pnpm-workspace.yaml + catalog: deps.
      #
      # Pehle yahan `npm ci` / `npm test` tha - dono BREAK the:
      #   - `npm ci` root par packageManager field ko ignore karta
      #     hai aur npm ki apni lockfile chahiye (npm-lock.yaml),
      #     jo is repo me exist hi nahi karta -> fail
      #   - `find . -name package.json -execdir npm ci` har package
      #     ko ALAG-ALAG install karta hai, jo pnpm workspace ke
      #     symlinks tod deta hai - @wideo11/ui jaise workspace:*
      #     deps resolve nahi hote
      # `pnpm/action-setup` version `packageManager` field se leta
      # hai, to CI aur local ek hi pnpm par hain.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # No version: reads packageManager from package.json.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # pnpm ka cache: ~/.pnpm-store. 'npm' ka cache knob
          # node_modules/.cache par point karta hai, jo pnpm store
          # ko cache NAHI karta.
          cache: 'pnpm'

      # ---- ONE install at the root ----
      #
      # pnpm workspaces me dependencies ROOT se install hoti hain -
      # `pnpm install` pnpm-workspace.yaml padhta hai aur sabhi
      # packages (apps/*, packages/*, services ke Node parts) ko
      # ek saath, workspace links ke saath resolve karta hai.
      # Per-package `npm ci` ka equivalent isme koi nahi, aur hona
      # bhi nahi chahiye.
      #
      # --frozen-lockfile: CI me lockfile ko UPDATE na kare. Agar
      # package.json aur pnpm-lock.yaml disagree kare, install fail
      # ho jayega - jo CHAHIYE, kyunki CI me silently lockfile
      # badalna hai hi nahi.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go build and vet for all Go services
        run: |
          # We'll build and vet all Go services we know of
          # Since we don't have a list, we'll search for go.mod files and run in their directories
          find . -name go.mod -not -path "./node_modules/*" -execdir go build ./... \;
          find . -name go.mod -not -path "./node_modules/*" -execdir go vet ./... \;

      # ---- pnpm test / typecheck ----
      #
      # Root scripts: "test": "turbo run test", "typecheck":
      # "turbo run typecheck". Turbo har package ka script run
      # karta hai jo DEFINE karta hai; jo define na kare, skip.
      # Isliye `pnpm test` sabhi apps + packages ke tests ek saath,
      # aur packages bina test script ke silently skip hote hain -
      # `find -execdir npm test` ki tarah har directory me fail
      # nahi hota (wo script-less packages me "missing script"
      # error deta tha).
      - name: Run tests (turbo, all packages)
        run: pnpm test

      - name: Typecheck (turbo, all packages)
        run: pnpm typecheck

      - name: Security Scan (Example: using GitHub CodeQL)
        uses: github/codeql-action/init@v2
        with:
          languages: go, javascript, typescript
      - uses: github/codeql-action/analyze@v2

      - name: Deploy (Placeholder)
        # We'll use the GITHUB_TOKEN for any deployment that requires it
        # For example, if we were to deploy to GitHub Pages or a container registry
        run: echo "Deployment step would go here, using ${{ secrets.GITHUB_TOKEN }} for authentication"
