version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wideo11-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wideo11
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: wideo11-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS JetStream for event streaming
  nats:
    image: nats:2.10-alpine
    container_name: wideo11-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats", "server", "check", "streaming"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: wideo11-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AlertManager for alerting
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: wideo11-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dashboard Service
  dashboard-service:
    build:
      context: ./services/dashboard-service
      dockerfile: Dockerfile
    container_name: wideo11-dashboard-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dashboard
      DB_SSL_MODE: disable
      PROMETHEUS_URL: http://prometheus:9090
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Webhook Receiver
  webhook-receiver:
    build:
      context: ./services/webhook-receiver
      dockerfile: Dockerfile
    container_name: wideo11-webhook-receiver
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: webhook_receiver
      DB_SSL_MODE: disable
      DASHBOARD_SERVICE_URL: http://dashboard-service:8080
      LOG_LEVEL: debug
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      dashboard-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitor Frontend (Next.js)
  monitor:
    build:
      context: ./apps/monitor
      dockerfile: Dockerfile
    container_name: wideo11-monitor
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
      NEXT_PUBLIC_WS_URL: ws://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy

  # Web Frontend (Next.js)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: wideo11-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080

  # Video Editor Frontend (Next.js)
  video-editor:
    build:
      context: ./apps/video-editor
      dockerfile: Dockerfile
    container_name: wideo11-video-editor
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
      NEXT_PUBLIC_WS_URL: ws://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy

  # Billing Service (Go)
  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: wideo11-billing-service
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: billing_service
      DB_SSL_MODE: disable
      LOG_LEVEL: debug
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Billing Frontend (Next.js)
  billing:
    build:
      context: ./apps/billing
      dockerfile: Dockerfile
    container_name: wideo11-billing
    ports:
      - "3003:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://billing-service:8082
    depends_on:
      billing-service:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  alertmanager_data:
  billing_data: