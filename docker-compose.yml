services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wideo11-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wideo11
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Alag-alag service databases pehli baar create ho jaati hain
      # Ye script empty data directory par hi chalti hai (pehli baar)
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: wideo11-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS JetStream for event streaming
  nats:
    image: nats:2.10-alpine
    container_name: wideo11-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    restart: unless-stopped
    healthcheck:
      # nats CLI binary alpine image me installed nahi hai, isliye monitoring
      # port ka /healthz endpoint use karte hain - busybox wget already available hai
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: wideo11-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      # Alert rules. Ye mount PEHLE MISSING tha jabki prometheus.yml me
      # `rule_files: ['/etc/prometheus/rules/*.yml']` likha hua tha. Matlab
      # Prometheus har start par khud poochta tha, kuch nahi milta tha, aur
      # chup chap koi rule load nahi karta tha - alert pipeline dikhta to bhi
      # tha par kabhi kuch trigger nahi hota tha.
      #
      # `ro` zaroori hai: Prometheus ko rules likhni nahi chahiye, sirf padhni
      # hain. Writable mount me ek typo host ke rule file ko overwrite kar
      # sakta tha.
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    command:
      # `--web.enable-lifecycle` lets a rule change be applied with
      # `curl -X POST localhost:9090/-/reload` instead of a full restart, which
      # briefly drops every scrape.
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AlertManager for alerting
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: wideo11-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dashboard Service
  dashboard-service:
    build:
      context: ./services/dashboard-service
      dockerfile: Dockerfile
    container_name: wideo11-dashboard-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dashboard
      DB_SSL_MODE: disable
      PROMETHEUS_URL: http://prometheus:9090
      NATS_URL: nats://nats:4222
      # JWT secret: auth-service ke SAME token validate karne ke liye (SSOT - .env se)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      LOG_LEVEL: debug
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      nats:
        condition: service_healthy
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================================
  # POSTFIX - Self-hosted SMTP relay (NO third-party mail provider)
  # ==================================================================
  # Ye apna khud ka mail server hai. SendGrid / Mailgun / SES kuch nahi -
  # isliye kisi teesre party ko ek bhi penny nahi jaati.
  #
  # Auth-service iske through SMTP bhejta hai (SMTP_HOST=mail, port 25).
  # Verify karne ke liye: docker compose exec mail cat /var/log/mail.log
  mail:
    build:
      context: ./infrastructure/mail
      dockerfile: Dockerfile
      args:
        # SSOT: .env se aati hain, hardcoded nahi
        POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:-mail.wideo11.local}
        POSTFIX_DOMAIN: ${POSTFIX_DOMAIN:-wideo11.local}
        # true  = local capture (log me email dikhta hai, internet nahi)
        # false = direct delivery (production ke liye, MX record zaroori)
        POSTFIX_CAPTURE_ONLY: ${POSTFIX_CAPTURE_ONLY:-true}
        # RELAYHOST: jis host tak Postfix mail bhejega. Syntax [smtp.host]:587
        # Ye isliye zaroori hai kyunki is host par OUTBOUND PORT 25 BLOCKED hai
        # (587/465 open hai). Khaali chhodne par Postfix seedha MX dhoondhega
        # aur port 25 pe atak jayega - email deliver nahi hoga.
        POSTFIX_RELAYHOST: ${POSTFIX_RELAYHOST:-}
    container_name: wideo11-mail
    hostname: ${POSTFIX_HOSTNAME:-mail.wideo11.local}
    ports:
      - "2525:25"
    environment:
      POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:-mail.wideo11.local}
      POSTFIX_DOMAIN: ${POSTFIX_DOMAIN:-wideo11.local}
      POSTFIX_RELAYHOST: ${POSTFIX_RELAYHOST:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================================================================
  # MINIO - Self-hosted S3-compatible object storage (NO paid provider)
  # ==================================================================
  # Apna khud ka storage hai. AWS S3 / GCS / Bunny CDN kuch nahi - kisi
  # teesre party ko ek bhi penny nahi jaati.
  #
  # Iska use: transcoding-service HLS chunks yaha 'video' bucket me
  # daalta hai, aur streaming seedha yahin se hoti hai (GKE compute bypass).
  #
  # SSOT: credentials .env se aati hain, code me hardcoded kuch nahi.
  minio:
    build:
      context: ./infrastructure/storage
      dockerfile: Dockerfile
      args:
        # Ye values build ke time chahiye (ENV me use hoti hain)
        MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wideo11-storage-secret}
    container_name: wideo11-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      # Runtime credentials (bhi SSOT se)
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wideo11-storage-secret}
      # Bucket name SSOT se - transcoding service isi name ko use karta hai
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET:-video}
      MINIO_THUMBNAIL_BUCKET: ${MINIO_THUMBNAIL_BUCKET:-thumbnails}
      # MinIO ka NATIVE Prometheus metrics expose karta hai is env se.
      # Bina iske /minio/v2/metrics/cluster pe console ka HTML aa jata hai,
      # aur humein data-egress ke REAL metrics nahi milte.
      # NOTE: ye sirf METRICS expose karta hai (data nahi) - safe hai.
      # Production me network policies se restrict kar lena chahiye.
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
    volumes:
      # Named volume = data container recreate par bhi safe rehta hai
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      # MinIO ka live endpoint check karte hain. NOTE: pehle yahan "mc ready local"
      # tha, lekin ye image sirf minio server binary rakhti hai (mc nahi) -
      # isliye healthcheck fail ho raha tha: "/bin/sh: mc: not found".
      # Dockerfile me curl install hai, isliye ussi se check karte hain.
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Bucket auto-provisioning + IAM - ek chhuta init container jo
  # 'video' / 'thumbnails' / 'avatars' buckets banata hai, avatars par
  # public-read policy lagata hai, aur auth-service ke liye ek BUCKET-SCOPED
  # IAM user banata hai (Phase A / gap #1 - root credentials rotate).
  #
  # Poori logic infrastructure/storage/init-storage.sh me hai (image ke andar),
  # inline YAML command nahi - quoting ke teen layers me bug chhupne se bache.
  minio-init:
    build:
      context: ./infrastructure/storage
      dockerfile: mc.Dockerfile
    container_name: wideo11-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wideo11-storage-secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET:-video}
      MINIO_THUMBNAIL_BUCKET: ${MINIO_THUMBNAIL_BUCKET:-thumbnails}
      MINIO_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET:-avatars}
      # Channel covers - alag bucket (wide banner vs square avatar)
      MINIO_COVER_BUCKET: ${MINIO_COVER_BUCKET:-covers}
      # HLS chunk lifecycle (days) - SSOT se
      MINIO_HLS_RETENTION_DAYS: ${MINIO_HLS_RETENTION_DAYS:-30}
      # ---- Scoped service account (root NAHI) ----
      # Ye wahi credentials hain jo auth-service ko diye jaate hain. Policy
      # sirf `avatars` bucket tak limited hai - policies/auth-avatars.json.
      MINIO_AUTH_ACCESS_KEY: ${MINIO_AUTH_ACCESS_KEY:?set MINIO_AUTH_ACCESS_KEY in .env - see infrastructure/storage/policies/README.md}
      MINIO_AUTH_SECRET_KEY: ${MINIO_AUTH_SECRET_KEY:?set MINIO_AUTH_SECRET_KEY in .env - see infrastructure/storage/policies/README.md}
    restart: "no"

  # Auth Service (Go) - users, sessions, bcrypt password hashing, JWT
  # Pehle ye service repo me maujood thi par kabhi compile nahi hui (module path
  # mismatch + khali go.sum) isliye deploy nahi thi. Ab compile karke deploy kiya gaya hai.
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: wideo11-auth-service
    ports:
      - "8085:8085"
    environment:
      # auth-service viper use karta hai - keys ko DATABASE_HOST / JWT_SECRET_KEY
      # format me padhta hai (dot ko underscore me convert karta hai).
      # Isliye yahan DB_* env names kaam nahi karte, DATABASE_* use kiya gaya hai.
      SERVER_PORT: 8085
      SERVER_MODE: release
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: auth_service
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      # SSOT: ye sab values .env se aati hain, code me hardcoded kuch nahi
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}

      # ---- DEVICE-PER-ACCOUNT LIMIT: ON / OFF SWITCH ----
      #
      # SPEC tha "ek device pe max 3 accounts". Wo rule local dev me TODTA tha:
      # developer ke paas ek hi laptop hai aur wahi se naye test accounts bante
      # hain, to 4th register pe 403 `device_limit_exceeded` aa jata tha.
      #
      #   DEVICE_LIMIT_ENABLED=false  -> cap OFF (unlimited accounts/device)
      #   DEVICE_LIMIT_ENABLED=true   -> cap ON  (MAX_ACCOUNTS accounts/device)
      #
      # Default `true` + 3 = SPEC behaviour, agar ye var bhool jaye to bhi.
      # Yaani production me jaan-boojh kar OFF karna hi padega - galti se
      # security ghaab nahi hoti (fail-secure, fail-open nahi).
      DEVICE_LIMIT_ENABLED: ${DEVICE_LIMIT_ENABLED:-true}
      DEVICE_LIMIT_MAX_ACCOUNTS: ${DEVICE_LIMIT_MAX_ACCOUNTS:-3}

      # Superadmin recovery accounts (2) - main superadmin fail ho to backup access
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-advchashampalup@gmail.com}

      # Master-root ka password. Ye env var set hone par
      # `bootstrap.DefaultSuperadminPasswordHash` IGNORE ho jata hai aur ye
      # value use hoti hai.
      #
      # KYUN ZAROORI: wo default hash SOURCE me compiled hai. Matlab repository
      # me koi bhi bcrypt-crack karne wala usse test karke master-root ka
      # password nikal sakta hai - default password effectively public ho jata
      # hai. Is var se password source se nikal kar .env (gitignored) me rehta
      # hai, aur rotate karna code change ke bina ho jaata hai.
      #
      # NOTE: ye value logs me kabhi print nahi hoti, aur plaintext kahin store
      # nahi hota - sirf bcrypt hash DB me jaata hai.
      SECURITY_SUPERADMIN_PASSWORD: ${SECURITY_SUPERADMIN_PASSWORD:-}
      SUPERADMIN_RECOVERY_1_EMAIL: ${SUPERADMIN_RECOVERY_1_EMAIL:-}
      SUPERADMIN_RECOVERY_1_PASSWORD: ${SUPERADMIN_RECOVERY_1_PASSWORD:-}
      SUPERADMIN_RECOVERY_2_EMAIL: ${SUPERADMIN_RECOVERY_2_EMAIL:-}
      SUPERADMIN_RECOVERY_2_PASSWORD: ${SUPERADMIN_RECOVERY_2_PASSWORD:-}
      # Device lock (retina lock) - SSOT se on/off
      SUPERADMIN_DEVICE_LOCK_ENABLED: ${SUPERADMIN_DEVICE_LOCK_ENABLED:-false}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL_MIN:-15}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
      JWT_ISSUER: wideo11-auth
      JWT_AUDIENCE: wideo11-api
      SERVER_BCRYPT_COST: ${BCRYPT_COST:-12}
      # ---- SECURITY (Phase A / gap #2) ----
      # CORS allowlist. `*` NAHI - wildcard + credentials browsers reject
      # karte hain, aur koi bhi site authenticated request bhej sakti hai.
      # Naye frontend origin add karne ke liye yahan comma-separated list badlo.
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:-http://localhost:3000}
      SECURITY_ALLOW_CREDENTIALS: ${SECURITY_ALLOW_CREDENTIALS:-true}
      # HSTS. Local dev plain HTTP par chalta hai aur HSTS browser cache
      # atka deta hai, isliye default OFF. Production me 31536000 rakho.
      SECURITY_HSTS_MAX_AGE: ${SECURITY_HSTS_MAX_AGE:-0}
      SECURITY_HSTS_INCLUDE_SUBDOMAINS: ${SECURITY_HSTS_INCLUDE_SUBDOMAINS:-false}
      # Verification lifecycle - 30 min TTL + purge worker
      VERIFICATION_TTL_MINUTES: ${VERIFICATION_TTL_MINUTES:-30}
      VERIFICATION_BASE_URL: ${VERIFICATION_BASE_URL:-http://localhost:3000}
      VERIFICATION_PURGE_ENABLED: ${VERIFICATION_PURGE_ENABLED:-true}
      PURGE_ENABLED: ${PURGE_ENABLED:-true}
      PURGE_INTERVAL_SECONDS: ${PURGE_INTERVAL_SECONDS:-60}
      PURGE_BATCH_SIZE: ${PURGE_BATCH_SIZE:-100}
      # SMTP ab apne khud ke Postfix par jata hai (koi paid provider nahi).
      # SMTP_HOST khaali karne par console transport par wapas aa jayega.
      EMAIL_HOST: ${SMTP_HOST:-mail}
      EMAIL_PORT: ${SMTP_PORT:-25}
      EMAIL_USER: ${SMTP_USER:-}
      EMAIL_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${SMTP_FROM:-no-reply@wideo11.com}

      # ---- STORAGE (MinIO) - apna self-hosted S3, koi paid provider nahi ----
      #
      # Avatar uploads yahan jate hain. Auth-service presigned URL deta hai,
      # browser seedha MinIO me PUT karta hai - file bytes app server par
      # kabhi nahi aate.
      #
      # NOTE: ye SCOPED service account hain, root NAHI. Ye account sirf
      # `avatars` bucket me object padh/lichh sakta hai - `video` bucket tak
      # pahunch hi nahi sakta, aur naya bucket banana bhi nahi sakta.
      # Agar ye credentials leak ho jaayein, blast radius sirf avatars hai -
      # poora storage cluster compromise nahi ho sakta.
      # Policy: infrastructure/storage/policies/auth-avatars.json
      # Root credentials sirf provisioning ke liye (minio-init) hain.
      STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
      STORAGE_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      STORAGE_ACCESS_KEY: ${MINIO_AUTH_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${MINIO_AUTH_SECRET_KEY:-}
      STORAGE_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET:-avatars}
      STORAGE_COVER_BUCKET: ${MINIO_COVER_BUCKET:-covers}
      STORAGE_PRESIGN_TTL_MINUTES: ${STORAGE_PRESIGN_TTL_MINUTES:-15}
      # `false` = bucket banao/policy lagao minio-init karega (root ke saath).
      # Scoped account ke paas `s3:CreateBucket` / `s3:PutBucketPolicy`
      # deliberately nahi hai - isliye yahan true nahi rakh sakte.
      STORAGE_MANAGE_BUCKET: "false"
      # NOTE: ye BROWSER ko dikhta hai (image yahan se load hoti hai),
      # isliye container-internal `minio:9000` NAHI - `localhost:9000`
      # hona chahiye.
      STORAGE_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-localhost:9000}
      STORAGE_USE_SSL: ${MINIO_USE_SSL:-false}
      EMAIL_FROM_NAME: ${SMTP_FROM_NAME:-Wideo11 Security}
      EMAIL_USE_TLS: ${SMTP_USE_TLS:-false}
      # WebAuthn / biometric - RP ID aur origin browser se match karne zaroori hain
      WEBAUTHN_RPID: ${WEBAUTHN_RPID:-localhost}
      WEBAUTHN_RP_DISPLAY_NAME: ${WEBAUTHN_RP_DISPLAY_NAME:-Wideo11}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:-http://localhost:3000}
      WEBAUTHN_SESSION_TIMEOUT_MINUTES: ${WEBAUTHN_SESSION_TIMEOUT_MINUTES:-5}
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Postfix ke upar depend karte hain taaki mail service ready ho
      mail:
        condition: service_started
      # Avatar bucket + scoped IAM user pehle se ready hone chahiye, warna
      # storage startup par fail ho jayega. `service_completed_successfully`
      # isliye ki abhaari half-provisioned state me start na ho.
      minio-init:
        condition: service_completed_successfully
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Transcoding Service - REAL FFmpeg HLS pipeline + MinIO upload
  # Pehle ye service deploy nahi thi (orphan thi). Ab deploy hai aur:
  #   - FFmpeg actually CHALA jata hai (.m3u8 + .ts chunks generate)
  #   - Chunks MinIO 'video' bucket me upload hote hain
  #   - Playback seedha MinIO se hoti hai (GKE compute bypass)
  # Hinglish: video transcode + MinIO upload dono real
  transcoding-service:
    build:
      context: ./services/transcoding-service
      dockerfile: Dockerfile
    container_name: wideo11-transcoding
    ports:
      - "8083:8083"
    environment:
      TRANSCODING_SERVICE_PORT: 8083
      # MinIO connection (self-hosted, SSOT se)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET:-video}
      # Public host jo playlist URL me use hoga (client ko yahi dikhta hai)
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-localhost:9000}
      # HLS segment duration - 2 ya 4 seconds (SSOT)
      HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-4}
      HLS_LIST_SIZE: ${HLS_LIST_SIZE:-0}
      # Kitne transcode parallel chal sakte hain
      TRANSCODING_MAX_WORKERS: ${TRANSCODING_MAX_WORKERS:-2}
      TRANSCODING_TEMP_DIR: /tmp/transcoding
      GIN_MODE: release
    depends_on:
      minio:
        condition: service_healthy
    # Hinglish: transcoding heavy CPU kaam hai - isliye resource limits
    # zaroori hain taaki doosre services starve na hon
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Currency Service - Multi-currency microservice (SSOT for exchange rates)
  # exchange_rates table yahi service banati hai; baaki services yahin se padhte hain.
  # DEFAULT source "manual" hai = koi network call NAHI = zero cost guarantee.
  currency-service:
    build:
      context: ./services/currency-service
      dockerfile: Dockerfile
    container_name: wideo11-currency-service
    ports:
      - "8086:8086"
    environment:
      # Sab values .env se (SSOT) - code me kuch hardcoded nahi
      CURRENCY_SERVICE_PORT: 8086
      CURRENCY_DB_HOST: postgres
      CURRENCY_DB_PORT: 5432
      CURRENCY_DB_USER: postgres
      CURRENCY_DB_PASSWORD: postgres
      CURRENCY_DB_NAME: currency_service
      CURRENCY_DB_SSLMODE: disable
      # 24 ghante ka fixed interval update
      CURRENCY_RATE_UPDATE_INTERVAL_HOURS: ${CURRENCY_RATE_UPDATE_INTERVAL_HOURS:-24}
      CURRENCY_RATE_FETCH_TIMEOUT_SECONDS: ${CURRENCY_RATE_FETCH_TIMEOUT_SECONDS:-30}
      # "manual" = offline seed data (zero cost)
      # "frankfurter" = LIVE + failover (primary Frankfurter, secondary exchangerate-api)
      CURRENCY_RATE_SOURCE: ${CURRENCY_RATE_SOURCE:-frankfurter}
      CURRENCY_BASE_CURRENCY: ${CURRENCY_BASE_CURRENCY:-INR}
      # ExchangeRate-API key - SECONDARY (failover) source ke liye
      # SSOT se aati hai; code me kabhi hardcoded nahi
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY:-}
      # Currency rounding - 2 decimal places (paise ka standard)
      CURRENCY_ROUNDING_PLACES: ${CURRENCY_ROUNDING_PLACES:-2}
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # cAdvisor - container resource metrics for Prometheus
  # KYUN ZAROORI: bina iske Prometheus ko sirf "up" milta hai - container CPU
  # aur memory ke liye cAdvisor chahiye hota hai. Iske bina dashboard pe
  # "no data" aata tha.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: wideo11-cadvisor
    # NOTE: koi host port expose NAHI kiya. Prometheus scrape internal docker
    # network se karta hai (cadvisor:8080), isliye host port ki zarurat nahi.
    # Pehle yahan "8080:8080" likha tha jo dashboard-service se conflict karta
    # tha (wo bhi 8080 use karta hai) - isliye hata diya.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
      # NOTE: `store_container_labels` PEHLE `false` tha. Iska matlab tha ki
      # per-container metrics me `name`/`container` LABEL hi nahi the - sirf
      # ek `id` label. Par asli problem ye hai ki `docker_only=true` ke saath
      # ek hi series mil rahi thi (`id=/`, 3.1GB) - yaani poori Docker VM ek
      # hi "container" ki tarah dikh rahi thi. Per-container CPU/memory/
      # restart panels isliye "No data" de rahe the.
      #
      # `true` karne se cgroup path ka `name` label milta hai, jisse har
      # container alag series ban jaata hai.
      #
      # VERIFY karne ke liye:
      #   curl -s 'localhost:9090/api/v1/query?query=count(count by(name)(container_memory_working_set_bytes))'
      # 1 se bada number aana chahiye (25+ expected).
      - --store_container_labels=true
    restart: always

  # MinIO Exporter - REAL bucket/object metrics for Prometheus
  # Official MinIO image blocked hone se us build ka metrics path HTML deta hai,
  # isliye ye chhota exporter MinIO Admin API se REAL stats (size, object count)
  # padhkar Prometheus text format me expose karta hai.
  # Dashboard ka data-egress panel AB REAL values dikhata hai (koi SEEDED nahi).
  minio-exporter:
    build:
      context: ./services/minio-exporter
      dockerfile: Dockerfile
    container_name: wideo11-minio-exporter
    ports:
      - "9100:9100"
    environment:
      MINIO_EXPORTER_PORT: 9100
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET:-video}
      MINIO_THUMBNAIL_BUCKET: ${MINIO_THUMBNAIL_BUCKET:-thumbnails}
      MINIO_EXPORTER_REFRESH_SECONDS: ${MINIO_EXPORTER_REFRESH_SECONDS:-30}
    depends_on:
      minio:
        condition: service_healthy
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Currency Dashboard (Next.js) - Port 3007
  # Live exchange rates table + converter. Data currency-service se aata hai.
  currency-app:
    build:
      context: .
      dockerfile: apps/currency/Dockerfile
    container_name: wideo11-currency-app
    ports:
      - "3007:3007"
    environment:
      # Browser se hit hone wala URL (container name nahi, localhost chahiye
      # kyunki ye browser me khulta hai - internal DNS browser ko nahi dikhta)
      NEXT_PUBLIC_CURRENCY_API: ${CURRENCY_PUBLIC_API:-http://localhost:8086}
    depends_on:
      currency-service:
        condition: service_healthy
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3007/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Superadmin App (Next.js) - Port 3008
  # DEDICATED master control panel (separate entity from user apps).
  # Click history, security events, user activity, test-account cleanup.
  # NOTE: ye app sirf superadmin/recovery accounts ke liye hai - backend
  # role check karta hai, ye sirf UI hai.
  superadmin-app:
    build:
      context: .
      dockerfile: apps/superadmin/Dockerfile
    container_name: wideo11-superadmin
    ports:
      - "3008:3008"
    environment:
      # Auth service ka internal URL - same-origin proxy routes isko use karte hain
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
    depends_on:
      auth-service:
        condition: service_healthy
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3008/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Webhook Receiver
  webhook-receiver:
    build:
      context: ./services/webhook-receiver
      dockerfile: Dockerfile
    container_name: wideo11-webhook-receiver
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: webhook_receiver
      DB_SSL_MODE: disable
      DASHBOARD_SERVICE_URL: http://dashboard-service:8080
      # JWT secret: auth-service ke SAME token validate karne ke liye (SSOT - .env se)
      LOG_LEVEL: debug
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      dashboard-service:
        condition: service_healthy
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Monitor Frontend (Next.js) - Port 3001
  # ==========================================================================
  # Ye Wideo11 ka apna monitoring dashboard hai - Grafana nahi.
  #
  # Grafana ko thoda add kiya gaya tha, par ye project jaan-boojh kar use
  # nahi karta. Reasons (jo repo me bhi documented hain):
  #   - `packages/charts` me ECharts wrappers PEHLE SE maujood hain, aur unka
  #     description literally "Grafana-like dashboards" hai - yaani custom
  #     dashboard banana is project ka MAANTA hai
  #   - Grafana ek alag 400MB+ image hai, apna database, apna auth, apni
  #     provisioning - ye poora system extra sirf isliye ki kuch chart ho
  #
  # Is service ko 3006 par shift kiya gaya tha Grafana ke liye; ab wapas 3001.
  #
  # NOTE: ye app pehle 5 HARDCODED metrics dikha raha tha (1.2K events/sec,
  # 245 users, 12ms latency, 12.5m session, 0.01% error) jinme se KOI bhi
  # real nahi tha - wo seedhe JSX me likhe the. Wo ab `/api/metrics` se
  # REAL Prometheus values larta hai, aur jahan metric instrument nahi hai
  # wahan "n/a" dikhata hai. Koi invented number nahi.
  # Details `apps/monitor/src/app/@telemetry/page.tsx` ke header comment me.
  monitor:
    build:
      context: .
      dockerfile: apps/monitor/Dockerfile
    container_name: wideo11-monitor
    ports:
      - "3001:3001"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
      NEXT_PUBLIC_WS_URL: ws://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy
    # ---- Container health ----
    #
    # Ye service pehle koi healthcheck ya restart policy NAHI rakhti thi.
    # Matlab: crash-loop me bhi `docker compose ps` me "Up" dikhta tha, aur
    # crash hone par koi restart nahi hota tha - app chupke se chali jaati
    # thi aur kisi ko pata nahi chalta tha.
    #
    # `/` hit karna application-layer check hai: sirf "port open hai" nahi,
    # balki "Next.js ne page serve kiya" confirm hota hai.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # ==========================================================================
  # MONITORING EXPORTERS
  # ==========================================================================
  # Ye do services isliye zaroori hain kyunki NATS aur disk ke liye
  # Prometheus-format metrics koi source DETROIT se nahi deta:
  #
  #   - NATS ke paas apna koi /metrics endpoint NAHI hai. Port 8222 pe JSON
  #     deta hai (/varz). Pehle compose me seedha `nats:8222/metrics` scrape
  #     kar raha tha, jo hamesha 404 deta tha - yaani NATS metrics CHUP CHAP
  #     gather nahi ho rahe the.
  #   - Disk metrics node_filesystem_* ke naam se aati hain, aur wo
  #     node-exporter se hi aati hain. Bina node-exporter ke
  #     `DiskFillingUp` aur `DiskSpaceCritical` rules PERMANENTLY INERT
  #     rehte - green dikhte par kabhi fire nahi karte.
  #
  # Dono ports PUBLISH nahi kiye - inhe sirf Prometheus internal network pe
  # chahiye. Ye jaan-boojh kar hai: inke bina koi unhe scrape kar sakta hai.

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    container_name: wideo11-nats-exporter
    command:
      # NOTE: flag set exporter version 0.15.0 ke saath VERIFIED hai. Teen
      # galtiyan isse pehle thi, teeno crash-loop laati thi (Go exporter
      # unknown flag pe usage print karke exit(2) karta hai, aur sahi flag
      # ke saath bhi galat invocation exit(0) se turant nikal jaata hai):
      #
      #   1. `-ldm=18`  - is version me ye flag exist hi nahi karta.
      #   2. `-subsz`   - sahi naam `-subz` hai (ek 's' kam).
      #   3. `-addr=http://nats:8222` - YE GALAT THA. `-addr` us exporter ka
      #      LISTEN host hai (default 0.0.0.0), NATS server ka URL nahi.
      #
      # NATS ka monitoring URL is version me POSITIONAL argument hai:
      #     prometheus-nats-exporter <flags> <nats-monitoring-url>
      # `-addr` ki jagah URL positional ke roop me LAST me aata hai. Isi liye
      # abhi tak NATS metrics kabhi nahi aaye - exporter ya mar raha tha ya
      # khud hi nikal raha tha.
      #
      # Image tag upgrade karte waqt ye dobara verify karo:
      #   docker run --rm natsio/prometheus-nats-exporter:<new-tag> -h
      - "-varz"        # server state, connections, memory
      - "-connz"       # per-connection detail
      - "-routez"      # cluster routing
      - "-subz"        # subscription counts
      - "-jsz=all"     # JetStream streams + consumers
      - "-port=7777"
      - "http://nats:8222"   # positional: NATS monitoring URL
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # NOTE: exporter v0.15.0 me `-healthz` flag maujood hai par `/healthz`
      # route REGISTER nahi karta - flag ke saath bhi 404 deta hai (v0.15
      # par verify kiya). Isiliye `/metrics` hi use kiya gaya hai.
      #
      # Sirf "200 aaya" check karna KAAM KA nahi: NATS down hone par bhi ye
      # 200 aur khaali series de deta hai, jisse crash-chasing impossible ho
      # jaati. Isliye ek ASLI series dhoondhi jaati hai - `gnatsd_varz_` tab
      # hi aata hai jab exporter NATS monitoring se actually data collect kar
      # raha hoga. Ye process-alive aur actually-collecting dono alag karta
      # hai.
      #
      # Series prefix `gnatsd_` hai, `nats_` nahi (v0.15 naming).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7777/metrics | grep -q '^gnatsd_varz_' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Host-level metrics: disk, CPU, memory, network, filesystem descriptors.
  #
  # `privileged: true` nahi hai, sirf `/` read-only mount chahiye. Ye is
  # service ko minimum privilege deta hai - wahi reason jisse cadvisor ko
  # privileged rakha gaya hai, wahan poori host visibility chahiye.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: wideo11-node-exporter
    command:
      - '--path.rootfs=/host'
      # pseudo-filesystems ko exclude karo, warna usage 100% dikhta hai aur
      # disk alert hamesha fire karta rehta hai
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      # NOTE: `rslave` YAHAN nahi hai. Docker Desktop on Windows (WSL2
      # backend) `rslave` accept nahi karta aur container create fail ho jata
      # hai:
      #   Error response from daemon: path / is mounted on / but it is not a
      #   shared or slave mount
      # Plain `:ro` kaafi hai - node-exporter sirf padhta hai, aur WSL2 pe
      # `/` already host filesystem hota hai. Linux par `rslave` chahiye ho to
      # `:ro,rslave` use karo.
      - /:/host:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # POSTGRES EXPORTER
  # ==========================================================================
  # Ye service isliye add ki gayi kyunki Postgres KABHI scrape nahi ho raha
  # tha. Verify kiya gaya: Prometheus me zero `pg_*` metrics the, aur postgres
  # koi scrape target hi nahi tha.
  #
  # Iska matlab ye 3 alert rules POORI TARAH DEAD thi - kabhi fire nahi ho
  # sakti thi:
  #     PostgresDown
  #     PostgresConnectionsNearMax
  #     PostgresReplicationLag
  #
  # Ye wahi trap hai jo disk alerts me tha (node_exporter ke bina) aur http
  # alerts me tha (http_* metrics ke bina): rule load ho jaati hai,
  # `promtool check rules` SUCCESS deta hai, par us expression ka data
  # source hi nahi hai. Ye DEAD monitoring sabse khatarnaak hoti hai -
  # sab green dikhta hai jabki kuch check hi nahi ho raha.
  #
  # Isliye rule comment out karne ke bajaye SOURCE add kiya gaya hai, taaki
  # wo alerts sach me kaam karein.
  #
  # NOTE: ye exporter READ-ONLY monitoring user se connect hota hai
  # (`POSTGRES_EXPORTER_USER`). Apna superuser pass karna mat karo - export
  # karne ke liye sirf `pg_monitor` role chahiye.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: wideo11-postgres-exporter
    environment:
      # Ye read-only monitoring user hai. Ye UPLOAD ke baad banaya jaata
      # hai (postgres-exporter-init), kyunki exporter ko chalne se PEHLE
      # database me maujood hona chahiye.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_EXPORTER_USER}:${POSTGRES_EXPORTER_PASSWORD}@postgres:5432/auth_service?sslmode=disable"
      PG_EXPORTER_WEB_LISTEN_ADDRESS: ":9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9187/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Monitoring user create karta hai. Ye CHALNA zaroori hai - upar wala
  # exporter connect hi nahi kar paayega bina iske.
  # `restart: no` kyunki ye ek one-shot task hai (migration + user creation),
  # service nahi - chalti hai, ban jaati hai, khatam.
  postgres-exporter-init:
    image: postgres:16-alpine
    container_name: wideo11-postgres-exporter-init
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # `PGPASSWORD` ZAROORI hai, `POSTGRES_PASSWORD` nahi.
      #
      # `psql` `POSTGRES_PASSWORD` nahi padhta - wo sirf postgres IMAGE ke
      # entrypoint script ka variable hai. Bina `PGPASSWORD` ke pscl
      # interactively password poochta hai, non-interactive container me
      # uska jawab koi nahi hota, aur ye fail hota hai:
      #     psql: error: ... FATAL: password authentication failed
      #     for user "postgres"
      # jisse monitoring user kabhi banta hi nahi, aur exporter hamesha
      # `pg_up 0` dikhata rehta hai.
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EXPORTER_USER: ${POSTGRES_EXPORTER_USER:-wideo_monitor}
      EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-wideo_monitor}
    command:
      - sh
      - -c
      - |
        set -e
        echo "waiting for postgres..."
        until pg_isready -h postgres -U "$${POSTGRES_USER}"; do sleep 1; done

        # ---- WHY NO `DO $$ ... $$;` BLOCK ----
        #
        # Pehle idempotency ke liye plpgsql `DO` block use kiya tha. Ye
        # compose ke andar 3 alag tareeke se toota:
        #
        #   1. `$$` compose me ESCAPE hai - container me `DO $ ... $;` banta
        #      tha: `ERROR: syntax error at or near "$"`
        #   2. `$$$$` likhne par bhi sahi nahi bana - `DO 1` aaya
        #
        # Compose + heredoc + dollar-quoting ka combination ek hi command me
        # teen layers ka escaping hai. Isse bachne ke liye dollar-quoting
        # HATAYA gaya hai. Neeche wala approach shell-native hai: ek
        # existence check, phir conditional create. Same idempotency, zero
        # escaping, aur debug karne me seedha samajh aata hai.
        #
        # NOTE: `PGPASSWORD` env var ka use hota hai, `POSTGRES_PASSWORD` ka
        # nahi - `psql` sirf PGPASSWORD padhta hai.
        PSQL="psql -h postgres -U $${POSTGRES_USER} -d postgres -v ON_ERROR_STOP=1"

        # `$$` yahan sirf ek dollar ka matlab hai (shell se env var
        # passthrough) - ye compose ka documented escape hai, aur plpgsql ke
        # $$ block se koi lena-dena nahi hai.
        if ! $${PSQL} -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$${EXPORTER_USER}'" | grep -q 1; then
          echo "creating monitoring role..."
          $${PSQL} -c "CREATE ROLE \"$${EXPORTER_USER}\" WITH LOGIN PASSWORD '$${EXPORTER_PASSWORD}'"
        else
          echo "monitoring role already exists - reusing it"
        fi

        # pg_monitor ek BUILT-IN role hai jo pg_* stats padhne ke liye sabse
        # kam privileges deta hai (Postgres 10+). Purane versions me ise
        # manually grants dene padte the.
        echo "granting pg_monitor..."
        $${PSQL} -c "GRANT pg_monitor TO \"$${EXPORTER_USER}\""

        # Verify karo ki role sach me login kar sakta hai - warna exporter
        # chupchap se `pg_up 0` dikhata rahega aur koi nahi samjhega ki kyun.
        echo "verifying monitoring role can connect..."
        PGPASSWORD="$${EXPORTER_PASSWORD}" psql -h postgres -U "$${EXPORTER_USER}" \
          -d auth_service -tAc "SELECT 'ok'" | grep -q ok

        echo "monitoring user ready"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ==========================================================================
  # web (Next.js Frontend) - REMOVED FROM COMPOSE ON PURPOSE
  # ==========================================================================
  # Ye service ab DELIBERATELY yahan nahi hai. Frontend ab host machine pe
  # `pnpm dev` se chalta hai, container me nahi.
  #
  # KYUN (rationale):
  #   - Layout/styling iteration ke liye har baar `docker compose build web`
  #     + `--force-recreate` karna 60-80 second leta hai (poora image layer
  #     rebuild + Next.js production build). Sirf ek className change karne
  #     ke liye itna lagna wasteful hai.
  #   - `next dev` native Hot Module Replacement deta hai - file save karte
  #     hi browser me turant reflect hota hai, bina bundle rebuild ya image
  #     purge ke.
  #   - Container rebuild karte waqt port 3000 briefly DOWN rehta tha, to
  #     har iteration me app unavailable ho jati thi.
  #
  # HOST DEV KE LIYE BACKEND WIRING (`apps/web/.env.local`):
  #   Container me service names DNS se resolve hote the (e.g.
  #   `http://auth-service:8085`). Host pe wo NAHI hote - Docker ka internal
  #   network host se invisible hai. Isliye host mode me `localhost` URLs
  #   zaroori hain:
  #     AUTH_SERVICE_URL         -> http://localhost:8085  (auth-service)
  #     BOT_SERVICE_URL          -> http://localhost:8080  (dashboard-service)
  #     RECOMMENDATION_SERVICE_URL -> http://localhost:8082 (recommendation)
  #     NEXT_PUBLIC_API_URL      -> http://localhost:8080
  #     NEXT_PUBLIC_AUTH_API     -> http://localhost:8085
  #   Ye ports host pe already published hain (docker-compose `ports:` maps).
  #
  # RE-ENABLE karna ho to: purana `web:` block yahan wapas paste karo
  # (`apps/web/Dockerfile` file chahiye rehke, wo aise hi hai).
  # Hinglish: frontend ab container me nahi, host pe `pnpm dev` se - fast
  #   HMR ke liye. Backend abhi bhi containers me hai (unka `depends_on`
  #   chain nahi badla hai).
  # ==========================================================================

  # ==========================================================================
  # Web Frontend (Next.js) - Port 3000   [RE-ENABLED]
  # ==========================================================================
  #
  # WHY IT IS A CONTAINER AGAIN
  #
  # Host pe `pnpm dev` se chalane ka ek practical problem tha: wo process
  # har IDE/agent session ke saath chala jaata tha, aur 3000 chupke se
  # girne par app ke andar ke SAARE links (login, register, dashboard) ek saath
  # dead ho jaate the - bina kisi error ke. Do baar hua hai.
  #
  # Container me chalane se:
  #   - `restart: unless-stopped` ke saath khud uthta hai
  #   - 3000 HARGHAR available rehta hai
  #   - video-editor ke andar ke auth links (`localhost:3000/...`) browser
  #     se chalte hi rahenge
  #
  # `--hostname 0.0.0.0` ZAROORI hai: `next dev` default se localhost par
  # bind karta hai, jo container ke andar se hi bahar (published port se)
  # reachable nahi hota. Symptom: container UP, par host se 3000 dead.
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wideo11-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Server-side: compose network ke andar service names resolve hote hain.
      # Ye container me hai, isliye `auth-service` theek hai aur `localhost`
      # NAHI - localhost container KHUD hota hai, doosre service ko nahi.
      AUTH_SERVICE_URL: http://auth-service:8085
      AUTH_INTERNAL_URL: http://auth-service:8085
      BOT_SERVICE_URL: http://dashboard-service:8080
      DASHBOARD_SERVICE_URL: http://dashboard-service:8080
      RECOMMENDATION_SERVICE_URL: http://billing-service:8082
      # Client-side (`NEXT_PUBLIC_*`): ye BROWSER me chalti hain, isliye
      # inhe host-mapped `localhost` hi rakhna padta hai - `auth-service` naam
      # browser resolve nahi kar sakta.
      NEXT_PUBLIC_AUTH_API: http://localhost:8085
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      NEXT_PUBLIC_MINIO_PUBLIC_HOST: http://localhost:9000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Next.js image optimiser ke liye. Production build me apna khud ka
      # loader use karta hai; ye sirf sharp/Next image bhi chalata rahe.
      NEXT_SHARP_PATH: /usr/lib/node_modules/sharp
      # ======================================================================
      # JWT_SECRET_KEY - YE LINE POORA LOGIN STUCK THA, YE AAPKA SYMPTOM THA.
      # ======================================================================
      #
      # `src/middleware.ts` har protected request par token verify karta hai,
      # aur usme fail-closed likha hai: `if (!JWT_SECRET) return false;`.
      #
      # Ye var is service ke `environment:` block me THA hi nahi, to container
      # ko ye mila hi nahi. `JWT_SECRET` undefined hua, aur fail-closed ka
      # matlab hua: HAR request unauthenticated.
      #
      # Isliye register 201 deta tha, login 200 deta tha, cookie set hoti thi -
      # aur phir bhi /dashboard user ko wapas /auth/login bhej raha tha. Har baar.
      # Na biometric ka masla tha, na email ka, na account ka. Ek missing env var.
      #
      # DHYAN: root `.env` me padha jaata hai sirf VARIABLE SUBSTITUTION ke liye -
      # container ke andar bahar nahi jaata. Isliye ye line auth-service wale
      # pattern se copy ki gayi hai, taake dono ek hi source se padhen.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/auth/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Video Editor Frontend (Next.js) - Port 3002
  video-editor:
    build:
      context: .
      dockerfile: apps/video-editor/Dockerfile
    container_name: wideo11-video-editor
    ports:
      - "3002:3002"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
      # ---- Navbar session awareness ----
      #
      # AuthNav session POOCHTA hai, token padhta nahi - session ek httpOnly
      # cookie hai (wideo11_session) jo cross-origin JS ko dikhti hi nahi.
      #
      # http://auth-service:8085 sirf compose network ke andar resolve hota
      # hai; browser use nahi chhoon sakta. Isliye HOST-mapped port diya gaya
      # hai (compose me 8085:8085 published hai).
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:8085
      # Web app container me nahi, host pe pnpm dev se chalti hai - ye upar
      # comment me bhi likha hai. Isliye login/register/dashboard URLs env se
      # aate hain: web kabhi 3006 pe chali gayi to editor ko ek line
      # badalna padega, code me nahi.
      NEXT_PUBLIC_LOGIN_URL: http://localhost:3000/auth/login
      NEXT_PUBLIC_REGISTER_URL: http://localhost:3000/auth/register
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3000/dashboard
      NEXT_PUBLIC_WS_URL: ws://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy
    # ---- Container health (see the note on `monitor` above for why) ----
    restart: unless-stopped
    healthcheck:
      # `/api/health` par check karo, `/` par nahi.
      #
      # `/` auth gate se 307 redirect hota hai (bina session ke), aur
      # `wget --spider` non-2xx ko failure maanta hai - isliye ye check hamesha
      # fail hota tha (352 consecutive failures) jabki app theek tha. `api/` gate
      # ke matcher se bahar hai, so ye route seedha 200 deta hai.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3002/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # Billing Service (Go)
  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: wideo11-billing-service
    ports:
      - "8082:8082"
    environment:
      # billing-service viper use karta hai, jo keys ko DATABASE_HOST / DATABASE_DBNAME
      # format me padhta hai (dot ko underscore me convert karta hai). Isliye yahan
      # DB_* env names kaam nahi karte aur service default localhost par chali jaati thi.
      # Saare env names viper ke expected format me diye gaye hain.
      SERVER_PORT: 8082
      SERVER_MODE: release
      # JWT secret: auth-service ke SAME token validate karne ke liye (SSOT - .env se).
      # Payout routes JWT protected hain - ye var na ho to woh 500 de sakte hain.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      # KYC provider: local = zero-cost deterministic bank validation
      KYC_PROVIDER: ${KYC_PROVIDER:-local}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: billing_service
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: UTC
      PORT: 8082
      ENVIRONMENT: development
      # JWT secret: auth-service ke SAME token validate karne ke liye (SSOT - .env se)
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
    # ---- Restart policy ----
    #
    # Ye service pehle bina restart policy ke thi. Matlab ek transient
    # stop (host sleep, Docker restart, koi compose down) usko silently
    # CHOR DE TA tha - aur crash hone par koi log bhi nahi banta, sirf exit 0.
    # Alertmanager aur webhook-receiver isi wajah se 7 ghante tak mare rahe aur
    # poora alert pipeline chupke se dead tha jabki dashboard "monitoring on"
    # dikha raha tha.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Billing Frontend (Next.js) - Port 3003
  billing:
    build:
      context: .
      dockerfile: apps/billing/Dockerfile
    container_name: wideo11-billing
    ports:
      - "3003:3003"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://billing-service:8082
    depends_on:
      billing-service:
        condition: service_healthy
    # ---- Container health (see the note on `monitor` above for why) ----
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3003/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # Admin Frontend (Next.js) - Port 3004
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: wideo11-admin
    ports:
      - "3004:3004"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy
    # ---- Container health (see the note on `monitor` above for why) ----
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3004/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # Analytics Frontend (Next.js) - Port 3005
  analytics:
    build:
      context: .
      dockerfile: apps/analytics/Dockerfile
    container_name: wideo11-analytics
    ports:
      - "3005:3005"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy
    # ---- Container health (see the note on `monitor` above for why) ----
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3005/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  minio_data:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  billing_data:
