services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wideo11-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wideo11
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Alag-alag service databases pehli baar create ho jaati hain
      # Ye script empty data directory par hi chalti hai (pehli baar)
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: wideo11-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS JetStream for event streaming
  nats:
    image: nats:2.10-alpine
    container_name: wideo11-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      # nats CLI binary alpine image me installed nahi hai, isliye monitoring
      # port ka /healthz endpoint use karte hain - busybox wget already available hai
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: wideo11-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AlertManager for alerting
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: wideo11-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dashboard Service
  dashboard-service:
    build:
      context: ./services/dashboard-service
      dockerfile: Dockerfile
    container_name: wideo11-dashboard-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dashboard
      DB_SSL_MODE: disable
      PROMETHEUS_URL: http://prometheus:9090
      NATS_URL: nats://nats:4222
      # JWT secret: auth-service ke SAME token validate karne ke liye (SSOT - .env se)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      LOG_LEVEL: debug
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================================
  # POSTFIX - Self-hosted SMTP relay (NO third-party mail provider)
  # ==================================================================
  # Ye apna khud ka mail server hai. SendGrid / Mailgun / SES kuch nahi -
  # isliye kisi teesre party ko ek bhi penny nahi jaati.
  #
  # Auth-service iske through SMTP bhejta hai (SMTP_HOST=mail, port 25).
  # Verify karne ke liye: docker compose exec mail cat /var/log/mail.log
  mail:
    build:
      context: ./infrastructure/mail
      dockerfile: Dockerfile
      args:
        # SSOT: .env se aati hain, hardcoded nahi
        POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:-mail.wideo11.local}
        POSTFIX_DOMAIN: ${POSTFIX_DOMAIN:-wideo11.local}
        # true  = local capture (log me email dikhta hai, internet nahi)
        # false = direct delivery (production ke liye, MX record zaroori)
        POSTFIX_CAPTURE_ONLY: ${POSTFIX_CAPTURE_ONLY:-true}
    container_name: wideo11-mail
    hostname: ${POSTFIX_HOSTNAME:-mail.wideo11.local}
    ports:
      - "2525:25"
    environment:
      POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:-mail.wideo11.local}
      POSTFIX_DOMAIN: ${POSTFIX_DOMAIN:-wideo11.local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================================================================
  # MINIO - Self-hosted S3-compatible object storage (NO paid provider)
  # ==================================================================
  # Apna khud ka storage hai. AWS S3 / GCS / Bunny CDN kuch nahi - kisi
  # teesre party ko ek bhi penny nahi jaati.
  #
  # Iska use: transcoding-service HLS chunks yaha 'video' bucket me
  # daalta hai, aur streaming seedha yahin se hoti hai (GKE compute bypass).
  #
  # SSOT: credentials .env se aati hain, code me hardcoded kuch nahi.
  minio:
    build:
      context: ./infrastructure/storage
      dockerfile: Dockerfile
      args:
        # Ye values build ke time chahiye (ENV me use hoti hain)
        MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wideo11-storage-secret}
    container_name: wideo11-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      # Runtime credentials (bhi SSOT se)
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wideo11-storage-secret}
      # Bucket name SSOT se - transcoding service isi name ko use karta hai
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET:-video}
      MINIO_THUMBNAIL_BUCKET: ${MINIO_THUMBNAIL_BUCKET:-thumbnails}
      # MinIO ka NATIVE Prometheus metrics expose karta hai is env se.
      # Bina iske /minio/v2/metrics/cluster pe console ka HTML aa jata hai,
      # aur humein data-egress ke REAL metrics nahi milte.
      # NOTE: ye sirf METRICS expose karta hai (data nahi) - safe hai.
      # Production me network policies se restrict kar lena chahiye.
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
    volumes:
      # Named volume = data container recreate par bhi safe rehta hai
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      # MinIO ka live endpoint check karte hain. NOTE: pehle yahan "mc ready local"
      # tha, lekin ye image sirf minio server binary rakhti hai (mc nahi) -
      # isliye healthcheck fail ho raha tha: "/bin/sh: mc: not found".
      # Dockerfile me curl install hai, isliye ussi se check karte hain.
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Bucket auto-provisioning - ek chhuta sa init container jo
  # 'video' aur 'thumbnails' buckets banata hai + lifecycle rules lagata hai
  minio-init:
    build:
      context: ./infrastructure/storage
      dockerfile: mc.Dockerfile
    container_name: wideo11-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wideo11-storage-secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET:-video}
      MINIO_THUMBNAIL_BUCKET: ${MINIO_THUMBNAIL_BUCKET:-thumbnails}
      # HLS chunk lifecycle (days) - SSOT se
      MINIO_HLS_RETENTION_DAYS: ${MINIO_HLS_RETENTION_DAYS:-30}
    entrypoint: >
      /bin/sh -c "
      mc alias set local $$MINIO_ENDPOINT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_VIDEO_BUCKET &&
      mc mb --ignore-existing local/$$MINIO_THUMBNAIL_BUCKET &&
      echo 'Buckets provisioned successfully' &&
      mc ls local &&
      exit 0
      "
    restart: "no"

  # Auth Service (Go) - users, sessions, bcrypt password hashing, JWT
  # Pehle ye service repo me maujood thi par kabhi compile nahi hui (module path
  # mismatch + khali go.sum) isliye deploy nahi thi. Ab compile karke deploy kiya gaya hai.
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: wideo11-auth-service
    ports:
      - "8085:8085"
    environment:
      # auth-service viper use karta hai - keys ko DATABASE_HOST / JWT_SECRET_KEY
      # format me padhta hai (dot ko underscore me convert karta hai).
      # Isliye yahan DB_* env names kaam nahi karte, DATABASE_* use kiya gaya hai.
      SERVER_PORT: 8085
      SERVER_MODE: release
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: auth_service
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      # SSOT: ye sab values .env se aati hain, code me hardcoded kuch nahi
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
      # Superadmin recovery accounts (2) - main superadmin fail ho to backup access
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-advchashampalup@gmail.com}
      SUPERADMIN_RECOVERY_1_EMAIL: ${SUPERADMIN_RECOVERY_1_EMAIL:-}
      SUPERADMIN_RECOVERY_1_PASSWORD: ${SUPERADMIN_RECOVERY_1_PASSWORD:-}
      SUPERADMIN_RECOVERY_2_EMAIL: ${SUPERADMIN_RECOVERY_2_EMAIL:-}
      SUPERADMIN_RECOVERY_2_PASSWORD: ${SUPERADMIN_RECOVERY_2_PASSWORD:-}
      # Device lock (retina lock) - SSOT se on/off
      SUPERADMIN_DEVICE_LOCK_ENABLED: ${SUPERADMIN_DEVICE_LOCK_ENABLED:-false}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL_MIN:-15}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
      JWT_ISSUER: wideo11-auth
      JWT_AUDIENCE: wideo11-api
      SERVER_BCRYPT_COST: ${BCRYPT_COST:-12}
      # Verification lifecycle - 30 min TTL + purge worker
      VERIFICATION_TTL_MINUTES: ${VERIFICATION_TTL_MINUTES:-30}
      VERIFICATION_BASE_URL: ${VERIFICATION_BASE_URL:-http://localhost:3000}
      VERIFICATION_PURGE_ENABLED: ${VERIFICATION_PURGE_ENABLED:-true}
      PURGE_ENABLED: ${PURGE_ENABLED:-true}
      PURGE_INTERVAL_SECONDS: ${PURGE_INTERVAL_SECONDS:-60}
      PURGE_BATCH_SIZE: ${PURGE_BATCH_SIZE:-100}
      # SMTP ab apne khud ke Postfix par jata hai (koi paid provider nahi).
      # SMTP_HOST khaali karne par console transport par wapas aa jayega.
      EMAIL_HOST: ${SMTP_HOST:-mail}
      EMAIL_PORT: ${SMTP_PORT:-25}
      EMAIL_USER: ${SMTP_USER:-}
      EMAIL_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${SMTP_FROM:-no-reply@wideo11.com}
      EMAIL_FROM_NAME: ${SMTP_FROM_NAME:-Wideo11 Security}
      EMAIL_USE_TLS: ${SMTP_USE_TLS:-false}
      # WebAuthn / biometric - RP ID aur origin browser se match karne zaroori hain
      WEBAUTHN_RPID: ${WEBAUTHN_RPID:-localhost}
      WEBAUTHN_RP_DISPLAY_NAME: ${WEBAUTHN_RP_DISPLAY_NAME:-Wideo11}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:-http://localhost:3000}
      WEBAUTHN_SESSION_TIMEOUT_MINUTES: ${WEBAUTHN_SESSION_TIMEOUT_MINUTES:-5}
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Postfix ke upar depend karte hain taaki mail service ready ho
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Transcoding Service - REAL FFmpeg HLS pipeline + MinIO upload
  # Pehle ye service deploy nahi thi (orphan thi). Ab deploy hai aur:
  #   - FFmpeg actually CHALA jata hai (.m3u8 + .ts chunks generate)
  #   - Chunks MinIO 'video' bucket me upload hote hain
  #   - Playback seedha MinIO se hoti hai (GKE compute bypass)
  # Hinglish: video transcode + MinIO upload dono real
  transcoding-service:
    build:
      context: ./services/transcoding-service
      dockerfile: Dockerfile
    container_name: wideo11-transcoding
    ports:
      - "8083:8083"
    environment:
      TRANSCODING_SERVICE_PORT: 8083
      # MinIO connection (self-hosted, SSOT se)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET:-video}
      # Public host jo playlist URL me use hoga (client ko yahi dikhta hai)
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-localhost:9000}
      # HLS segment duration - 2 ya 4 seconds (SSOT)
      HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-4}
      HLS_LIST_SIZE: ${HLS_LIST_SIZE:-0}
      # Kitne transcode parallel chal sakte hain
      TRANSCODING_MAX_WORKERS: ${TRANSCODING_MAX_WORKERS:-2}
      TRANSCODING_TEMP_DIR: /tmp/transcoding
      GIN_MODE: release
    depends_on:
      minio:
        condition: service_healthy
    # Hinglish: transcoding heavy CPU kaam hai - isliye resource limits
    # zaroori hain taaki doosre services starve na hon
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Currency Service - Multi-currency microservice (SSOT for exchange rates)
  # exchange_rates table yahi service banati hai; baaki services yahin se padhte hain.
  # DEFAULT source "manual" hai = koi network call NAHI = zero cost guarantee.
  currency-service:
    build:
      context: ./services/currency-service
      dockerfile: Dockerfile
    container_name: wideo11-currency-service
    ports:
      - "8086:8086"
    environment:
      # Sab values .env se (SSOT) - code me kuch hardcoded nahi
      CURRENCY_SERVICE_PORT: 8086
      CURRENCY_DB_HOST: postgres
      CURRENCY_DB_PORT: 5432
      CURRENCY_DB_USER: postgres
      CURRENCY_DB_PASSWORD: postgres
      CURRENCY_DB_NAME: currency_service
      CURRENCY_DB_SSLMODE: disable
      # 24 ghante ka fixed interval update
      CURRENCY_RATE_UPDATE_INTERVAL_HOURS: ${CURRENCY_RATE_UPDATE_INTERVAL_HOURS:-24}
      CURRENCY_RATE_FETCH_TIMEOUT_SECONDS: ${CURRENCY_RATE_FETCH_TIMEOUT_SECONDS:-30}
      # "manual" = offline seed data (zero cost)
      # "frankfurter" = LIVE + failover (primary Frankfurter, secondary exchangerate-api)
      CURRENCY_RATE_SOURCE: ${CURRENCY_RATE_SOURCE:-frankfurter}
      CURRENCY_BASE_CURRENCY: ${CURRENCY_BASE_CURRENCY:-INR}
      # ExchangeRate-API key - SECONDARY (failover) source ke liye
      # SSOT se aati hai; code me kabhi hardcoded nahi
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY:-}
      # Currency rounding - 2 decimal places (paise ka standard)
      CURRENCY_ROUNDING_PLACES: ${CURRENCY_ROUNDING_PLACES:-2}
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # cAdvisor - container resource metrics for Prometheus
  # KYUN ZAROORI: bina iske Prometheus ko sirf "up" milta hai - container CPU
  # aur memory ke liye cAdvisor chahiye hota hai. Iske bina dashboard pe
  # "no data" aata tha.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: wideo11-cadvisor
    # NOTE: koi host port expose NAHI kiya. Prometheus scrape internal docker
    # network se karta hai (cadvisor:8080), isliye host port ki zarurat nahi.
    # Pehle yahan "8080:8080" likha tha jo dashboard-service se conflict karta
    # tha (wo bhi 8080 use karta hai) - isliye hata diya.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --housekeeping_interval=10s
      - --docker_only=true
      - --store_container_labels=false
    restart: always

  # MinIO Exporter - REAL bucket/object metrics for Prometheus
  # Official MinIO image blocked hone se us build ka metrics path HTML deta hai,
  # isliye ye chhota exporter MinIO Admin API se REAL stats (size, object count)
  # padhkar Prometheus text format me expose karta hai.
  # Dashboard ka data-egress panel AB REAL values dikhata hai (koi SEEDED nahi).
  minio-exporter:
    build:
      context: ./services/minio-exporter
      dockerfile: Dockerfile
    container_name: wideo11-minio-exporter
    ports:
      - "9100:9100"
    environment:
      MINIO_EXPORTER_PORT: 9100
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wideo11admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET:-video}
      MINIO_THUMBNAIL_BUCKET: ${MINIO_THUMBNAIL_BUCKET:-thumbnails}
      MINIO_EXPORTER_REFRESH_SECONDS: ${MINIO_EXPORTER_REFRESH_SECONDS:-30}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Currency Dashboard (Next.js) - Port 3007
  # Live exchange rates table + converter. Data currency-service se aata hai.
  currency-app:
    build:
      context: .
      dockerfile: apps/currency/Dockerfile
    container_name: wideo11-currency-app
    ports:
      - "3007:3007"
    environment:
      # Browser se hit hone wala URL (container name nahi, localhost chahiye
      # kyunki ye browser me khulta hai - internal DNS browser ko nahi dikhta)
      NEXT_PUBLIC_CURRENCY_API: ${CURRENCY_PUBLIC_API:-http://localhost:8086}
    depends_on:
      currency-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3007/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Superadmin App (Next.js) - Port 3008
  # DEDICATED master control panel (separate entity from user apps).
  # Click history, security events, user activity, test-account cleanup.
  # NOTE: ye app sirf superadmin/recovery accounts ke liye hai - backend
  # role check karta hai, ye sirf UI hai.
  superadmin-app:
    build:
      context: .
      dockerfile: apps/superadmin/Dockerfile
    container_name: wideo11-superadmin
    ports:
      - "3008:3008"
    environment:
      # Auth service ka internal URL - same-origin proxy routes isko use karte hain
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3008/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Webhook Receiver
  webhook-receiver:
    build:
      context: ./services/webhook-receiver
      dockerfile: Dockerfile
    container_name: wideo11-webhook-receiver
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: webhook_receiver
      DB_SSL_MODE: disable
      DASHBOARD_SERVICE_URL: http://dashboard-service:8080
      # JWT secret: auth-service ke SAME token validate karne ke liye (SSOT - .env se)
      LOG_LEVEL: debug
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      dashboard-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitor Frontend (Next.js) - Port 3001
  monitor:
    build:
      context: .
      dockerfile: apps/monitor/Dockerfile
    container_name: wideo11-monitor
    ports:
      - "3001:3001"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
      NEXT_PUBLIC_WS_URL: ws://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy

  # Web Frontend (Next.js) - Port 3000
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wideo11-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
      # Auth service ka internal URL - same-origin proxy routes isko use karte hain
      AUTH_INTERNAL_URL: http://auth-service:8085
      # NEXTAUTH_SECRET: web app ka middleware next-auth getToken() use karta hai.
      # Bina iske middleware "MissingSecret" throw karta tha - isliye zaroori hai.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}

  # Video Editor Frontend (Next.js) - Port 3002
  video-editor:
    build:
      context: .
      dockerfile: apps/video-editor/Dockerfile
    container_name: wideo11-video-editor
    ports:
      - "3002:3002"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
      NEXT_PUBLIC_WS_URL: ws://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy

  # Billing Service (Go)
  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: wideo11-billing-service
    ports:
      - "8082:8082"
    environment:
      # billing-service viper use karta hai, jo keys ko DATABASE_HOST / DATABASE_DBNAME
      # format me padhta hai (dot ko underscore me convert karta hai). Isliye yahan
      # DB_* env names kaam nahi karte aur service default localhost par chali jaati thi.
      # Saare env names viper ke expected format me diye gaye hain.
      SERVER_PORT: 8082
      SERVER_MODE: release
      # JWT secret: auth-service ke SAME token validate karne ke liye (SSOT - .env se).
      # Payout routes JWT protected hain - ye var na ho to woh 500 de sakte hain.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      # KYC provider: local = zero-cost deterministic bank validation
      KYC_PROVIDER: ${KYC_PROVIDER:-local}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: billing_service
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: UTC
      PORT: 8082
      ENVIRONMENT: development
      # JWT secret: auth-service ke SAME token validate karne ke liye (SSOT - .env se)
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Billing Frontend (Next.js) - Port 3003
  billing:
    build:
      context: .
      dockerfile: apps/billing/Dockerfile
    container_name: wideo11-billing
    ports:
      - "3003:3003"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://billing-service:8082
    depends_on:
      billing-service:
        condition: service_healthy

  # Admin Frontend (Next.js) - Port 3004
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: wideo11-admin
    ports:
      - "3004:3004"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy

  # Analytics Frontend (Next.js) - Port 3005
  analytics:
    build:
      context: .
      dockerfile: apps/analytics/Dockerfile
    container_name: wideo11-analytics
    ports:
      - "3005:3005"
    environment:
      # Audit proxy ke liye auth-service ka internal URL (activity tracking)
      AUTH_INTERNAL_URL: http://auth-service:8085
      NEXT_PUBLIC_API_URL: http://dashboard-service:8080
    depends_on:
      dashboard-service:
        condition: service_healthy

  # Editor Frontend (Next.js) - Port 3006
volumes:
  minio_data:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  alertmanager_data:
  billing_data:
